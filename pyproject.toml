[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tko"
version = "0.1.0"
description = "TKO — Autonomous Tokocrypto LIVE Trading Bot (Windows 10+)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "raidvoltus" }]
keywords = ["tokocrypto", "crypto", "trading", "autonomous", "live"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial :: Investment",
    "Private :: Do Not Upload",
]

dependencies = [
    # Prefer requirements.lock for bit-for-bit reproducible installs (CI).
    "ccxt>=4.5.29,<5",
    "python-telegram-bot>=22.5,<23",
    "pydantic>=2.12.5,<3",
    "pydantic-settings>=2.12.0,<3",
    "keyring>=25.7.0,<27",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.2",
    "pytest-cov>=6.0",
    "ruff>=0.14.7",
]
packaging = [
    "pyinstaller>=6.0",
]

[project.scripts]
tko = "tko.runtime.entrypoint:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
markers = [
    "integration: tests with mocked exchange (no network)",
]
testpaths = ["tests"]
