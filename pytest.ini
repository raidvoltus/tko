[pytest]
pythonpath = .
testpaths = tests
addopts =
    -ra
    --strict-markers
    --tb=short
    -q
markers =
    unit: fast unit tests
    integration: requires IPC/service/exchange
    windows: Windows-only (auto-skipped on non-Windows)
    ml: requires scikit-learn (auto-skipped if absent)
    slow: longer than ~1s
filterwarnings =
    ignore::DeprecationWarning
