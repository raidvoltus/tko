# TKO Level A + Level B Windows certification (GitHub-hosted windows-2022)
# Does NOT equal Microsoft Store certification.
# Level C clean-VM physical checks remain operator/manual or self-hosted.

name: windows-release-certification

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      smoke:
        description: "Run EXE smoke test"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  windows-release-certification:
    name: windows-release-certification
    runs-on: windows-2022
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Source integrity
        shell: pwsh
        run: |
          git rev-parse HEAD
          git status --porcelain
          git log -1 --oneline
          if (git status --porcelain) { Write-Error "Dirty tree"; exit 1 }

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest ruff pyinstaller

      - name: Ruff
        shell: pwsh
        run: python -m ruff check .

      - name: Pytest
        shell: pwsh
        run: |
          $env:TKO_IPC_DIR = Join-Path $env:TEMP ("tko_ipc_" + [guid]::NewGuid().ToString("N"))
          python -m pytest -q --tb=line

      - name: Static order authority audit
        shell: pwsh
        run: |
          python -c @"
          from pathlib import Path
          sites = []
          for p in Path('src').rglob('*.py'):
              for i,l in enumerate(p.read_text(encoding='utf-8', errors='ignore').splitlines(),1):
                  if 'new_order' in l:
                      sites.append(f'{p}:{i}:{l.strip()}')
          print('\n'.join(sites))
          # Only rest definition + execution manager call + reject in entry allowed
          assert any('execution/manager.py' in s and 'rest.new_order' in s for s in sites)
          assert any('tokocrypto/rest.py' in s and 'def new_order' in s for s in sites)
          "@

      - name: Clean PyInstaller build
        shell: pwsh
        run: |
          powershell -ExecutionPolicy Bypass -File scripts/build_windows_release.ps1 -Clean

      - name: Dist layout + no bundled token
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File scripts/windows_install_test.ps1

      - name: Security tests (IPC unit + dist scan)
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File scripts/windows_security_test.ps1

      - name: WACK marker (NOT APPLICABLE)
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File scripts/windows_wack.ps1

      - name: EXE smoke (Core + GUI + IPC bootstrap)
        if: github.event_name != 'pull_request' || inputs.smoke == true
        shell: pwsh
        env:
          TKO_CERT_FRESH_TOKEN: "1"
        run: |
          powershell -ExecutionPolicy Bypass -File scripts/windows_smoke_test.ps1

      - name: Generate certification report
        if: always()
        shell: pwsh
        run: |
          powershell -ExecutionPolicy Bypass -File scripts/windows_certification.ps1 -SkipBuild
        continue-on-error: true

      - name: Upload Windows artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tko-windows-certification
          path: |
            dist/TKO-Core.exe
            dist/TKO-GUI.exe
            dist/SHA256SUMS
            dist/release-manifest.json
            certification/out/**
          if-no-files-found: warn
          retention-days: 14

      - name: Signing status
        shell: pwsh
        run: |
          Write-Host "Code signing: BLOCKED — PRODUCTION CODE SIGNING NOT CONFIGURED"
          Write-Host "Internal certification only — not Microsoft Store certification"
