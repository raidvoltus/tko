name: windows-release-certification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  PYTHONPATH: ${{ github.workspace }}
  PYTHONUTF8: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  windows-release-certification:
    name: windows-release-certification
    runs-on: windows-2022
    timeout-minutes: 75

    steps:
      - uses: actions/checkout@v4

      - name: Source integrity
        shell: pwsh
        run: |
          git rev-parse HEAD
          git log -1 --oneline
          if (git status --porcelain) { throw "Dirty tree" }

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Sanity PYTHONPATH
        shell: pwsh
        run: |
          Write-Host "PYTHONPATH=$env:PYTHONPATH"
          Write-Host "GITHUB_WORKSPACE=$env:GITHUB_WORKSPACE"
          python -c "import sys,os; print(sys.path[:3]); print(os.environ.get('PYTHONPATH'))"
          python -c "import src; print('src import OK')"

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest ruff pyinstaller

      - name: Ruff
        shell: pwsh
        run: python -m ruff check src tests main.py

      - name: Pytest
        shell: pwsh
        run: |
          $env:TKO_IPC_DIR = Join-Path $env:TEMP ("tko_ipc_" + [guid]::NewGuid().ToString("N"))
          python -m pytest

      - name: Static order authority audit
        shell: pwsh
        run: |
          python -c "from pathlib import Path; sites=[]
          for p in Path('src').rglob('*.py'):
            for i,l in enumerate(p.read_text(encoding='utf-8', errors='ignore').splitlines(),1):
              if 'new_order' in l: sites.append(f'{p}:{i}:{l.strip()}')
          print(chr(10).join(sites))
          assert any('execution' in s and 'manager' in s and 'rest.new_order' in s for s in sites)
          assert any('tokocrypto' in s and 'rest' in s and 'def new_order' in s for s in sites)"

      - name: Clean PyInstaller build
        shell: pwsh
        run: |
          Set-Location $env:GITHUB_WORKSPACE
          $env:PYTHONPATH = $env:GITHUB_WORKSPACE
          & "$env:GITHUB_WORKSPACE\scripts\build_windows_release.ps1" -Clean -SourceRoot $env:GITHUB_WORKSPACE -DistDir (Join-Path $env:GITHUB_WORKSPACE "dist")
          if ($LASTEXITCODE -ne 0) { throw "build failed exit=$LASTEXITCODE" }
          $dist = Join-Path $env:GITHUB_WORKSPACE "dist"
          Write-Host "Post-build dist:"
          Get-ChildItem $dist -Force -ErrorAction SilentlyContinue | ForEach-Object { Write-Host $_.FullName }
          if (-not (Test-Path (Join-Path $dist "TKO-Core.exe"))) { throw "TKO-Core.exe missing after build" }
          if (-not (Test-Path (Join-Path $dist "TKO-GUI.exe"))) { throw "TKO-GUI.exe missing after build" }

      - name: Hash manifest + dist layout
        shell: pwsh
        run: |
          Set-Location $env:GITHUB_WORKSPACE
          $dist = Join-Path $env:GITHUB_WORKSPACE "dist"
          Write-Host "=== DIST LISTING ==="
          Write-Host "dist=$dist exists=$(Test-Path $dist)"
          if (-not (Test-Path $dist)) { throw "dist missing after build" }
          Get-ChildItem $dist -Force | ForEach-Object {
            Write-Host ("  {0}  {1}  dir={2}" -f $_.Name, $_.Length, $_.PSIsContainer)
          }

          $core = Join-Path $dist "TKO-Core.exe"
          $gui  = Join-Path $dist "TKO-GUI.exe"
          $sums = Join-Path $dist "SHA256SUMS"
          $man  = Join-Path $dist "release-manifest.json"

          $fail = 0
          foreach ($item in @(
            @{ n = "core_exe"; p = $core },
            @{ n = "gui_exe"; p = $gui },
            @{ n = "sha256sums"; p = $sums },
            @{ n = "manifest"; p = $man }
          )) {
            $ok = Test-Path -LiteralPath $item.p
            Write-Host ("[{0}] {1} -> {2}" -f ($(if ($ok) {"PASS"} else {"FAIL"}), $item.n, $item.p))
            if (-not $ok) { $fail++ }
          }

          $tokens = @(Get-ChildItem -LiteralPath $dist -Recurse -Filter "ipc.token" -ErrorAction SilentlyContinue)
          if ($tokens.Count -gt 0) {
            Write-Host "[FAIL] bundled ipc.token found"
            $fail++
          } else {
            Write-Host "[PASS] no_bundled_ipc_token"
          }

          if ($fail -gt 0) { throw "Dist layout failed ($fail checks)" }

          # Hash manifest (explicit exit codes)
          & "$env:GITHUB_WORKSPACE\scripts\hash_manifest.ps1" -DistDir $dist
          if ($LASTEXITCODE -ne 0) { throw "hash_manifest failed exit=$LASTEXITCODE" }
          Write-Host "Hash + dist layout OK"

      - name: Security tests
        shell: pwsh
        run: |
          Set-Location $env:GITHUB_WORKSPACE
          & "$env:GITHUB_WORKSPACE\scripts\windows_security_test.ps1"
          if ($LASTEXITCODE -ne 0) { throw "security tests failed" }

      - name: WACK marker
        shell: pwsh
        run: |
          & "$env:GITHUB_WORKSPACE\scripts\windows_wack.ps1"

      - name: EXE smoke
        shell: pwsh
        env:
          TKO_CERT_FRESH_TOKEN: "1"
        run: |
          Set-Location $env:GITHUB_WORKSPACE
          & "$env:GITHUB_WORKSPACE\scripts\windows_smoke_test.ps1" -DistDir (Join-Path $env:GITHUB_WORKSPACE "dist")
          if ($LASTEXITCODE -ne 0) { throw "smoke failed" }

      - name: Signing status
        shell: pwsh
        run: Write-Host "L4.signing BLOCKED until Azure Trusted Signing secrets configured"

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tko-windows-certification
          path: |
            dist/TKO-Core.exe
            dist/TKO-GUI.exe
            dist/SHA256SUMS
            dist/release-manifest.json
            certification/out/**
          if-no-files-found: warn
          retention-days: 14
