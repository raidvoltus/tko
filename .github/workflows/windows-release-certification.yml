name: windows-release-certification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONPATH: ${{ github.workspace }}
  PYTHONUTF8: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  windows-release-certification:
    name: windows-release-certification
    runs-on: windows-2022
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - name: Source integrity
        shell: pwsh
        run: |
          git rev-parse HEAD
          git log -1 --oneline
          if (git status --porcelain) { throw "Dirty tree" }

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Sanity PYTHONPATH
        shell: pwsh
        run: |
          Write-Host "PYTHONPATH=$env:PYTHONPATH"
          python -c "import src; print('src OK')"

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest ruff pyinstaller

      - name: Ruff
        shell: pwsh
        run: python -m ruff check src tests main.py

      - name: Pytest
        shell: pwsh
        run: |
          $env:TKO_IPC_DIR = Join-Path $env:TEMP ("tko_ipc_" + [guid]::NewGuid().ToString("N"))
          python -m pytest

      - name: Static order authority audit
        shell: pwsh
        run: |
          python -c "from pathlib import Path; sites=[]
          for p in Path('src').rglob('*.py'):
            for i,l in enumerate(p.read_text(encoding='utf-8', errors='ignore').splitlines(),1):
              if 'new_order' in l: sites.append(f'{p}:{i}:{l.strip()}')
          print(chr(10).join(sites))
          assert any('execution' in s and 'manager' in s and 'rest.new_order' in s for s in sites)
          assert any('tokocrypto' in s and 'rest' in s and 'def new_order' in s for s in sites)
          assert any('entry.py' in s and 'place_order' in s for s in sites)"

      - name: Clean PyInstaller onedir build
        shell: pwsh
        run: |
          Set-Location $env:GITHUB_WORKSPACE
          $env:PYTHONPATH = $env:GITHUB_WORKSPACE
          & "$env:GITHUB_WORKSPACE\scripts\build_windows_release.ps1" -Clean -SourceRoot $env:GITHUB_WORKSPACE -DistDir (Join-Path $env:GITHUB_WORKSPACE "dist")
          if ($LASTEXITCODE -ne 0) { throw "build failed" }
          $core = Join-Path $env:GITHUB_WORKSPACE "dist\TKO-Core\TKO-Core.exe"
          $gui  = Join-Path $env:GITHUB_WORKSPACE "dist\TKO-GUI\TKO-GUI.exe"
          if (-not (Test-Path $core)) { throw "missing $core" }
          if (-not (Test-Path $gui))  { throw "missing $gui" }
          Write-Host "Core size=$((Get-Item $core).Length) GUI size=$((Get-Item $gui).Length)"

      - name: Hash + dist layout + secret scan
        shell: pwsh
        run: |
          Set-Location $env:GITHUB_WORKSPACE
          $dist = Join-Path $env:GITHUB_WORKSPACE "dist"
          $core = Join-Path $dist "TKO-Core\TKO-Core.exe"
          $gui  = Join-Path $dist "TKO-GUI\TKO-GUI.exe"
          $sums = Join-Path $dist "SHA256SUMS"
          $man  = Join-Path $dist "release-manifest.json"
          foreach ($p in @($core,$gui,$sums,$man)) {
            if (-not (Test-Path $p)) { throw "missing $p" }
            Write-Host "[PASS] $p"
          }
          & "$env:GITHUB_WORKSPACE\scripts\hash_manifest.ps1" -DistDir $dist
          if ($LASTEXITCODE -ne 0) { throw "hash failed" }
          & "$env:GITHUB_WORKSPACE\scripts\windows_secret_scan.ps1" -Root $env:GITHUB_WORKSPACE
          if ($LASTEXITCODE -ne 0) { throw "secret scan failed" }

      - name: Security tests (IPC unit)
        shell: pwsh
        run: |
          Set-Location $env:GITHUB_WORKSPACE
          & "$env:GITHUB_WORKSPACE\scripts\windows_security_test.ps1"
          if ($LASTEXITCODE -ne 0) { throw "security failed" }

      - name: WACK marker
        shell: pwsh
        run: |
          & "$env:GITHUB_WORKSPACE\scripts\windows_wack.ps1"

      - name: Actual EXE smoke (Core + GUI + IPC + restart)
        shell: pwsh
        env:
          TKO_CERT_FRESH_TOKEN: "1"
        run: |
          Set-Location $env:GITHUB_WORKSPACE
          & "$env:GITHUB_WORKSPACE\scripts\windows_smoke_test.ps1" -DistDir (Join-Path $env:GITHUB_WORKSPACE "dist")
          if ($LASTEXITCODE -ne 0) { throw "smoke failed" }

      - name: Write certification report
        shell: pwsh
        run: |
          $out = Join-Path $env:GITHUB_WORKSPACE "certification\out"
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          $dist = Join-Path $env:GITHUB_WORKSPACE "dist"
          $core = Join-Path $dist "TKO-Core\TKO-Core.exe"
          $gui  = Join-Path $dist "TKO-GUI\TKO-GUI.exe"
          $coreSha = (Get-FileHash $core -Algorithm SHA256).Hash.ToLower()
          $guiSha  = (Get-FileHash $gui -Algorithm SHA256).Hash.ToLower()
          $report = [ordered]@{
            product = "TKO"
            version = (Get-Content VERSION -Raw).Trim()
            commit = $env:GITHUB_SHA
            platform = "windows-2022"
            packager = "pyinstaller-onedir"
            final_gate = "CI_WINDOWS_CERTIFICATION_PASS"
            microsoft_store_certified = $false
            code_signing = "NOT_CONFIGURED"
            wack = "NOT_APPLICABLE"
            artifacts = @(
              @{ path = "TKO-Core/TKO-Core.exe"; sha256 = $coreSha }
              @{ path = "TKO-GUI/TKO-GUI.exe"; sha256 = $guiSha }
            )
            notes = @(
              "Actual EXE smoke executed on GitHub-hosted windows-2022"
              "Not a substitute for operator clean-VM Level C if policy requires physical isolation"
              "No LIVE exchange orders in CI"
            )
          }
          $report | ConvertTo-Json -Depth 6 | Set-Content (Join-Path $out "certification-report.json") -Encoding utf8
          @"
          # TKO Windows Certification Report
          Commit: $($env:GITHUB_SHA)
          Core SHA256: $coreSha
          GUI SHA256: $guiSha
          Signing: NOT_CONFIGURED
          WACK: NOT_APPLICABLE
          Microsoft Store: false
          CI gate: PASS (windows-2022 actual EXE smoke)
          "@ | Set-Content (Join-Path $out "certification-report.md") -Encoding utf8

      - name: Signing status
        shell: pwsh
        run: |
          Write-Host "CODE SIGNING: NOT_CONFIGURED"
          Write-Host "Scripts retained for future OIDC Trusted Signing — no PFX in repo"

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tko-windows-certification
          path: |
            dist/TKO-Core/**
            dist/TKO-GUI/**
            dist/SHA256SUMS
            dist/release-manifest.json
            dist/smoke-results.json
            release/TKO-Windows/**
            certification/out/**
          if-no-files-found: warn
          retention-days: 30
