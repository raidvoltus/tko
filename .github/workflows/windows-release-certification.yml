# TKO Level A + Level B Windows certification (windows-2022)
# Internal certification only — NOT Microsoft Store certification.
name: windows-release-certification

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write  # for future OIDC Trusted Signing / attestations

jobs:
  windows-release-certification:
    name: windows-release-certification
    runs-on: windows-2022
    timeout-minutes: 75

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Source integrity
        shell: pwsh
        run: |
          git rev-parse HEAD
          git log -1 --oneline
          if (git status --porcelain) { throw "Dirty tree" }

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest ruff pyinstaller

      - name: Ruff
        shell: pwsh
        run: python -m ruff check src tests main.py

      - name: Pytest
        shell: pwsh
        run: |
          $env:TKO_IPC_DIR = Join-Path $env:TEMP ("tko_ipc_" + [guid]::NewGuid().ToString("N"))
          python -m pytest -q --tb=line

      - name: Static order authority audit
        shell: pwsh
        run: |
          python -c "from pathlib import Path; sites=[]
          for p in Path('src').rglob('*.py'):
            for i,l in enumerate(p.read_text(encoding='utf-8', errors='ignore').splitlines(),1):
              if 'new_order' in l: sites.append(f'{p}:{i}:{l.strip()}')
          print(chr(10).join(sites))
          assert any('execution' in s and 'manager' in s and 'rest.new_order' in s for s in sites)
          assert any('tokocrypto' in s and 'rest' in s and 'def new_order' in s for s in sites)"

      - name: Clean PyInstaller build
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File scripts/build_windows_release.ps1 -Clean

      - name: Hash manifest
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File scripts/hash_manifest.ps1 -DistDir dist

      - name: Dist layout + no bundled token
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File scripts/windows_install_test.ps1

      - name: Security tests (IPC unit + dist scan)
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File scripts/windows_security_test.ps1

      - name: WACK marker (NOT APPLICABLE)
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File scripts/windows_wack.ps1

      - name: EXE smoke (Core + GUI + IPC bootstrap)
        shell: pwsh
        env:
          TKO_CERT_FRESH_TOKEN: "1"
        run: powershell -ExecutionPolicy Bypass -File scripts/windows_smoke_test.ps1

      - name: Code signing status
        shell: pwsh
        run: |
          Write-Host "L4.signing: BLOCKED — PRODUCTION CODE SIGNING NOT CONFIGURED"
          Write-Host "Configure Azure Trusted Signing secrets to enable scripts/windows_sign.ps1"

      - name: Upload Windows artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tko-windows-certification
          path: |
            dist/TKO-Core.exe
            dist/TKO-GUI.exe
            dist/SHA256SUMS
            dist/release-manifest.json
            certification/out/**
          if-no-files-found: warn
          retention-days: 14
