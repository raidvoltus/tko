name: windows-release-certification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  PYTHONPATH: ${{ github.workspace }}
  PYTHONUTF8: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  windows-release-certification:
    name: windows-release-certification
    runs-on: windows-2022
    timeout-minutes: 75

    steps:
      - uses: actions/checkout@v4

      - name: Source integrity
        shell: pwsh
        run: |
          git rev-parse HEAD
          git log -1 --oneline
          if (git status --porcelain) { throw "Dirty tree" }

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Sanity PYTHONPATH
        shell: pwsh
        run: |
          Write-Host "PYTHONPATH=$env:PYTHONPATH"
          Write-Host "GITHUB_WORKSPACE=$env:GITHUB_WORKSPACE"
          python -c "import sys,os; print(sys.path[:3]); print(os.environ.get('PYTHONPATH'))"
          python -c "import src; print('src import OK', src)"

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest ruff pyinstaller

      - name: Ruff
        shell: pwsh
        run: python -m ruff check src tests main.py

      - name: Pytest
        shell: pwsh
        run: |
          $env:TKO_IPC_DIR = Join-Path $env:TEMP ("tko_ipc_" + [guid]::NewGuid().ToString("N"))
          python -m pytest

      - name: Static order authority audit
        shell: pwsh
        run: |
          python -c "from pathlib import Path; sites=[]
          for p in Path('src').rglob('*.py'):
            for i,l in enumerate(p.read_text(encoding='utf-8', errors='ignore').splitlines(),1):
              if 'new_order' in l: sites.append(f'{p}:{i}:{l.strip()}')
          print(chr(10).join(sites))
          assert any('execution' in s and 'manager' in s and 'rest.new_order' in s for s in sites)
          assert any('tokocrypto' in s and 'rest' in s and 'def new_order' in s for s in sites)"

      - name: Clean PyInstaller build
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File scripts/build_windows_release.ps1 -Clean

      - name: Hash manifest
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File scripts/hash_manifest.ps1 -DistDir dist

      - name: Dist layout + no bundled token
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File scripts/windows_install_test.ps1

      - name: Security tests
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File scripts/windows_security_test.ps1

      - name: WACK marker
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File scripts/windows_wack.ps1

      - name: EXE smoke
        shell: pwsh
        env:
          TKO_CERT_FRESH_TOKEN: "1"
        run: powershell -ExecutionPolicy Bypass -File scripts/windows_smoke_test.ps1

      - name: Signing status
        shell: pwsh
        run: Write-Host "L4.signing BLOCKED until Azure Trusted Signing secrets configured"

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tko-windows-certification
          path: |
            dist/TKO-Core.exe
            dist/TKO-GUI.exe
            dist/SHA256SUMS
            dist/release-manifest.json
            certification/out/**
          if-no-files-found: warn
          retention-days: 14
