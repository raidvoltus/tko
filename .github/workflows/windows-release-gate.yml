# Lightweight required check name for branch protection / rulesets.
# Full work runs in windows-release-certification.yml

name: windows-release-gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  windows-release-gate:
    name: windows-release-gate
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install + test
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest ruff
          $env:TKO_IPC_DIR = Join-Path $env:TEMP ("gate_" + [guid]::NewGuid().ToString("N"))
          python -m ruff check . 
          python -m pytest -q --tb=line
      - name: Package format note
        shell: pwsh
        run: |
          Write-Host "Full EXE build/smoke: see workflow windows-release-certification"
          Write-Host "WACK: NOT APPLICABLE (portable PyInstaller EXE)"
          Write-Host "Microsoft Store certification: NOT CLAIMED"
