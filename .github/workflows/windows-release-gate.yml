name: windows-release-gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONPATH: ${{ github.workspace }}
  PYTHONUTF8: "1"
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  windows-release-gate:
    name: windows-release-gate
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install + Ruff + Pytest
        shell: pwsh
        run: |
          Write-Host "PYTHONPATH=$env:PYTHONPATH"
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest ruff
          python -m ruff check src tests main.py
          $env:TKO_IPC_DIR = Join-Path $env:TEMP ("gate_" + [guid]::NewGuid().ToString("N"))
          python -m pytest
      - name: Notes
        shell: pwsh
        run: |
          Write-Host "Full EXE: windows-release-certification"
          Write-Host "WACK: NOT APPLICABLE"
          Write-Host "Signing: BLOCKED until configured"
