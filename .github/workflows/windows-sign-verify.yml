# Informational only — not a production signing gate.
# Actual signing scripts: scripts/windows_sign.ps1, scripts/windows_sign_verify.ps1
# Future: enable Azure Trusted Signing via OIDC (no PFX / no client secret in repo).
name: windows-sign-verify

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["windows-release-certification"]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  actions: read

jobs:
  windows-sign-verify:
    name: windows-sign-verify
    runs-on: windows-2022
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    steps:
      - uses: actions/checkout@v4
      - name: Signing status (no secrets required)
        shell: pwsh
        run: |
          Write-Host "=== TKO code signing status ==="
          Write-Host "Status: NOT CONFIGURED"
          Write-Host "Reason: Trusted Signing / OIDC not enabled for this release track"
          Write-Host "Repo scripts present:"
          Write-Host "  - scripts/windows_sign.ps1 (Azure Trusted Signing + SignTool + dlib; no PFX)"
          Write-Host "  - scripts/windows_sign_verify.ps1 (Authenticode + timestamp + chain)"
          Write-Host "Do NOT store PFX, PKCS#12, or Azure client secrets in the repository."
          Write-Host "When enabling later: use federated credential / OIDC, not long-lived client secrets."
          Write-Host "This job is informational and does not fail the pipeline."
          exit 0
