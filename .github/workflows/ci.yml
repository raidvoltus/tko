name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install (locked)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock
          pip install -e ".[dev]"
      - name: Lint
        run: ruff check src tests
      - name: Unit tests
        run: pytest -q -m "not integration"
      - name: Integration tests
        run: |
          # Exit code 5 = no tests selected for marker; treat as success when suite has none yet.
          set +e
          pytest -q -m integration
          code=$?
          if [ "$code" -eq 5 ]; then
            echo "No integration tests collected; OK"
            exit 0
          fi
          exit "$code"
