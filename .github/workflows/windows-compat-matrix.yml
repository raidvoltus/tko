name: windows-compat-matrix

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONPATH: ${{ github.workspace }}
  PYTHONUTF8: "1"
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  compat:
    strategy:
      fail-fast: false
      matrix:
        locale: [en-US, id-ID]
        python-version: ["3.11"]
    runs-on: windows-2022
    name: "windows-2022 · ${{ matrix.locale }} · py${{ matrix.python-version }}"
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install + test
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest ruff
          python -m ruff check src tests main.py
          $env:TKO_IPC_DIR = Join-Path $env:TEMP ("mx_" + [guid]::NewGuid().ToString("N"))
          python -m pytest
      - name: Locale note
        shell: pwsh
        run: |
          Write-Host "Locale tag: ${{ matrix.locale }}"
          try { Set-Culture ${{ matrix.locale }} } catch { Write-Host "Set-Culture limited on runner" }
